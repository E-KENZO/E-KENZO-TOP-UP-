<!DOCTYPE html>
<html lang="km">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-KENZO TOP UP</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

<div class="logo">

<img src="assets/icons/logo.png" alt="E-KENZO">

<div>

<h1>E-KENZO TOP UP</h1>

<p>បញ្ចូលពេជ្រហ្គេម • រហ័ស • សុវត្ថិភាព</p>

</div>

</div>

<button class="menu-btn">

<img src="assets/icons/menu.png" alt="Menu">

</button>

</header>

<section class="banner">

<img id="banner" src="assets/banners/banner1.png" alt="Banner">

<div class="dots">

<span class="dot active"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</section>

<section class="games">

<h2>ជ្រើសរើសហ្គេម</h2>
<div class="game-grid">

<a href="freefire.html" class="game-card">
    <img src="assets/games/freefire.png" alt="Free Fire">
    <h3>Free Fire</h3>
</a>

<a href="mobilelegends.html" class="game-card">
    <img src="assets/games/mobilelegends.png" alt="Mobile Legends">
    <h3>Mobile Legends</h3>
</a>

<a href="pubg.html" class="game-card">
    <img src="assets/games/pubg.png" alt="PUBG Mobile">
    <h3>PUBG Mobile</h3>
</a>

<a href="hok.html" class="game-card">
    <img src="assets/games/hok.png" alt="Honor of Kings">
    <h3>Honor of Kings</h3>
</a>

    </div>
    </section>

<footer class="footer">

<p>© 2026 E-KENZO TOP UP</p>

<p>រក្សាសិទ្ធិគ្រប់យ៉ាង</p>

</footer>

<script>

const banners = [
"assets/banners/banner1.png",
"assets/banners/banner2.png",
"assets/banners/banner3.png"
];

let index = 0;

const banner = document.getElementById("banner");

const dots = document.querySelectorAll(".dot");

setInterval(()=>{

index++;

if(index>=banners.length){

index=0;

}

banner.src=banners[index];

dots.forEach(d=>d.classList.remove("active"));

dots[index].classList.add("active");

},3000);

</script>

</body>

    </html>
