<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-KENZO TOP UP</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
 <header class="header">

    <div class="logo">

        <img src="assets/icons/logo.jpg" alt="E-KENZO">

        <div class="logo-text">
            <h1>E-KENZO</h1>
            <p>Game Top Up</p>
        </div>

    </div>

    <button class="menu-btn" onclick="openMenu()">

        <img src="assets/icons/Menu.png" alt="Menu">

    </button>

 </header>
 <div id="side-menu" class="side-menu">

    <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">✕</a>

    <a href="index.html">🏠 ទំព័រដើម</a>

    <a href="freefire.html">🔥 Free Fire</a>

    <a href="mobilelegends.html">⚔️ Mobile Legends</a>

    <a href="pubg.html">🎯 PUBG Mobile</a>

    <a href="hok.html">👑 Honor of Kings</a>

    <a href="#">💬 Telegram</a>

    <a href="#">📞 ទំនាក់ទំនង</a>

 </div>
 <section class="banner">

    <img id="banner" src="assets/banners/banner1.png" alt="Banner">

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

 </section>
 <section class="games">

    <h2>ជ្រើសរើសហ្គេម</h2>

    <div class="game-grid">

        <a href="#" class="game-card" id="freefire-card">
            <img src="assets/games/freefire.jpeg" alt="Free Fire">
            <h3>Free Fire</h3>
        </a>

        <a href="mobilelegends.html" class="game-card">
            <img src="assets/games/mobilelegends.jpg" alt="Mobile Legends">
            <h3>Mobile Legends</h3>
        </a>

        <a href="pubg.html" class="game-card">
            <img src="assets/games/pubg.jpeg" alt="PUBG Mobile">
            <h3>PUBG Mobile</h3>
        </a>

        <a href="hok.html" class="game-card">
            <img src="assets/games/hok.jpeg" alt="Honor of Kings">
            <h3>Honor of Kings</h3>
        </a>

    </div>

 </section>
 <a href="https://t.me/ekenzostore" class="telegram-float" target="_blank">

   <img src="assets/icons/telegram.jpeg" alt="Telegram">

    <span class="online-dot"></span>

    <span class="online-text"></span>

 </a>

 <footer class="site-footer">
    © 2026 E-KENZO
    Game Top Up. All Rights Reserved.
 </footer>
<div class="package-overlay" id="packageOverlay">

    <div class="package-panel" id="packagePanel">

        <div class="panel-header">
            <h2>Select Package</h2>

            <button id="closePanel">✕</button>
        </div>

        <div class="package-grid" id="packageGrid"></div>

<div id="playerSection" style="display:none; margin-top:20px;">

    <input
        type="text"
        id="player-id"
        placeholder="Enter Free Fire Player ID">

    <div id="loading" class="loading" style="display:none;">
        Checking...
    </div>

    <div id="player-info" style="display:none; margin-top:12px;">
        <strong id="player-name"></strong><br>
        ID : <span id="player-id-show"></span>
    </div>

    <button id="continueBtn">
        Continue
    </button>

     </div>

    </div>

<script src="script.js"></script>

</body>
</html>
