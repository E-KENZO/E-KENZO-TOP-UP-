<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-KENZO Game Top Up</title>
<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b1220;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:#111827;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.telegram-btn{
    background:#0088cc;
    padding:10px 15px;
    border-radius:10px;
    color:white;
    text-decoration:none;
}


.hero{
    position:relative;
    height:350px;
    overflow:hidden;
}


.slider img{
    width:100%;
    height:350px;
    object-fit:cover;
    display:none;
}


.slider img.active{
    display:block;
}


.hero-content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}


.hero-content h1{
    font-size:35px;
    text-shadow:0 0 10px black;
}


.hero-content button{
    margin-top:20px;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
}


#games{
    padding:30px;
    text-align:center;
}

</style>

</head>


<body>


<header>

<div class="logo">
🎮 E-KENZO
</div>

<nav>
<a href="#">Home</a>
<a href="#games">Top Up</a>
<a href="#">Payment</a>
<a href="#">Support</a>
</nav>

<a class="telegram-btn" href="#">
Telegram
</a>

</header>



<section class="hero">

<div class="slider">

<img src="assets/banners/banner1.jpg" class="active">

<img src="assets/banners/banner2.jpg">

<img src="assets/banners/banner3.jpg">

    </div>


<div class="hero-content">

<h1>
E-KENZO GAME TOP UP
</h1>

<p>
Fast • Safe • Secure
</p>


<button>
TOP UP NOW
</button>


</div>

</section>



<section id="games">

<h2>
Choose Your Game
</h2>

</section>



<script>

let images = document.querySelectorAll(".slider img");

let i = 0;


setInterval(()=>{

images[i].classList.remove("active");

i++;

if(i >= images.length){
    i = 0;
}

images[i].classList.add("active");


},3000);


</script>



</body>

  </html>
