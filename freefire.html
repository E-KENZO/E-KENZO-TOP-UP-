<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire | E-KENZO</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <img src="assets/icons/logo.jpg" alt="Logo">

        <div class="logo-text">

            <h1>E-KENZO</h1>

            <p>Free Fire Top Up</p>

        </div>

    </div>

    <a href="index.html" class="back-home">
        ← Home
    </a>

</header>
<section class="player-box">

    <h2>ពិនិត្យមើលឈ្មោះ ⚡</h2>

    <input
        type="text"
        id="player-id"
        placeholder="បញ្ចូល id free fire">
    <div id="loading" style="display:none;">
        ⏳កំពុងស្វែងរកឈ្មោះ...
    </div>
    
    <div id="player-info" style="display:none;">

        <h3 id="player-name"></h3>

        <p>
            
    </div>

</section>
    <section class="package-section" id="packageSection">

    <h2>Select Package</h2>

    <div class="package-grid">

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>25 Diamonds</h3>
            <p>$0.25</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>50 Diamonds</h3>
            <p>$0.45</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>100 Diamonds</h3>
            <p>$0.90</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>210 Diamonds</h3>
            <p>$1.80</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/weekly.jpeg" alt="">
            <h3>Weekly Pass</h3>
            <p>$1.89</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/monthly.jpeg" alt="">
            <h3>Monthly Pass</h3>
            <p>$7.99</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/levelup.webp" alt="">
            <h3>Level Up Pass</h3>
            <p>$3.99</p>
        </div>

    </div>

    </section>
    <section id="paymentSection" class="payment-section" style="display:none;">

    <h2>Payment Method</h2>

    <div class="payment-methods">

        <label class="pay-item">
            <input type="radio" name="payment" checked>
            ABA
        </label>

        <label class="pay-item">
            <input type="radio" name="payment">
            ACLEDA
        </label>

        <label class="pay-item">
            <input type="radio" name="payment">
            KHQR
        </label>

    </div>

    <div class="summary-card">
        <h3>Order Summary</h3>

        <p>Package :
            <span id="selectedPackage">-</span>
        </p>

        <p>Price :
            <span id="selectedPrice">$0.00</span>
        </p>

        <button class="pay-btn">
            Continue Payment
        </button>
    </div>

</section>
<script src="script.js"></script>

</body>
</html>
