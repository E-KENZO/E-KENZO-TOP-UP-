<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire | E-KENZO</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <img src="assets/icons/logo.jpg" alt="Logo">

        <div class="logo-text">

            <h1>E-KENZO</h1>

            <p>Free Fire Top Up</p>

        </div>

    </div>

    <a href="index.html" class="back-home">
        ← Home
    </a>

</header>

<section class="ff-banner">

    <img src="assets/banners/banner1.png" alt="Free Fire Banner">

</section>
<section class="player-box">

    <h2>Player Information</h2>

    <input
        type="text"
        id="player-id"
        placeholder="Enter Free Fire Player ID">

    <button id="checkPlayerBtn">
        CHECK PLAYER
    </button>

    <div id="loading" style="display:none;">
        Checking...
    </div>

    <div id="player-info" style="display:none;">

        <h3 id="player-name"></h3>

        <p>
            UID :
            <span id="player-id-show"></span>
        </p>

    </div>

</section>
<script src="script.js"></script>

</body>
</html>
