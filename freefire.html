<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire | E-KENZO</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">

        <img src="assets/icons/logo.jpg" alt="Logo">

        <div class="logo-text">

            <h1>E-KENZO</h1>

            <p>Free Fire Top Up</p>

        </div>

    </div>

    <a href="index.html" class="back-home">
        ← Home
    </a>

</header>

<section class="ff-banner">

    <img src="assets/banners/banner1.png" alt="Free Fire Banner">

</section>
<section class="player-box">

    <h2>Player Information</h2>

    <input
        type="text"
        id="player-id"
        placeholder="Enter Free Fire Player ID">

    <button id="checkPlayerBtn">
        CHECK PLAYER
    </button>

    <div id="loading" style="display:none;">
        Checking...
    </div>

    <div id="player-info" style="display:none;">

        <h3 id="player-name"></h3>

        <p>
            UID :
            <span id="player-id-show"></span>
        </p>

    </div>

</section>
    <section class="package-section" id="packageSection" style="display:none;">

    <h2>Select Package</h2>

    <div class="package-grid">

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>25 Diamonds</h3>
            <p>$0.25</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>50 Diamonds</h3>
            <p>$0.45</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>100 Diamonds</h3>
            <p>$0.90</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/diamond.png" alt="">
            <h3>210 Diamonds</h3>
            <p>$1.80</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/weekly.png" alt="">
            <h3>Weekly Pass</h3>
            <p>$1.89</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/monthly.png" alt="">
            <h3>Monthly Pass</h3>
            <p>$7.99</p>
        </div>

        <div class="package-card">
            <img src="assets/icons/levelup.png" alt="">
            <h3>Level Up Pass</h3>
            <p>$3.99</p>
        </div>

    </div>

    </section>
    <section id="paymentSection" class="payment-section">

    <h2>Payment</h2>

    <img src="assets/khqr.png" alt="KHQR" class="khqr">

    <button class="pay-btn">
        Continue Payment
    </button>

        </section>
<script src="script.js"></script>

</body>
</html>
