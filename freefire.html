<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire - E-KENZO TOP UP</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<header class="header">

    <button class="menu-btn" onclick="history.back()">

        <img src="assets/icons/back.png" alt="Back">

    </button>

    <div class="logo">

        <img src="assets/games/freefire.jpeg" alt="Free Fire">
        <div class="logo-text">

            <h1>Free Fire</h1>

            <p>បញ្ចូលពេជ្រ</p>

        </div>

    </div>

</header>
    <section class="player-box">

    <h2>បញ្ចូលលេខសម្គាល់អ្នកលេង</h2>

    <input
        type="text"
        id="player-id"
        placeholder="Player ID">

    <div class="player-result">

    <div class="loading" id="loading" style="display:none;">

    <div class="loading-spinner"></div>

    <span>កំពុងពិនិត្យគណនី...</span>

    </div>

    <div class="player-info" id="player-info" style="display:none;">

        <img src="assets/icons/player.png" alt="Player">

        <div>

            <h3 id="player-name">Player Name</h3>

            <p>ID: <span id="player-id-show"></span></p>

        </div>

    </div>

    </div>

    </section>
    <section class="packages">

    <h2>ជ្រើសរើសកញ្ចប់</h2>

    <div class="package-grid">

        <div class="package-card" onclick="selectPackage(this)">
    <img src="assets/icons/diamond.png" alt="25 Diamond">
    <h3>25 Diamonds</h3>
    <p>$0.25</p>
</div>

<div class="package-card" onclick="selectPackage(this)">
    <img src="assets/icons/diamond.png" alt="50 Diamond">
    <h3>50 Diamonds</h3>
    <p>$0.45</p>
</div>

<div class="package-card" onclick="selectPackage(this)">
    <img src="assets/icons/diamond.png" alt="100 Diamond">
    <h3>100 Diamonds</h3>
    <p>$0.90</p>
</div>

<div class="package-card" onclick="selectPackage(this)">
    <img src="assets/icons/diamond.png" alt="210 Diamond">
    <h3>210 Diamonds</h3>
    <p>$1.80</p>
    </div>

    </div>

    </section>
    <section class="payment">

    <div class="payment-info">

        <span id="selected-package">
            មិនទាន់ជ្រើសរើសកញ្ចប់
        </span>

        <span id="selected-price">
            $0.00
        </span>

    </div>

    <button id="pay-btn" disabled>
        សូមជ្រើសរើសកញ្ចប់ជាមុន
    </button>

</section>

<script src="script.js"></script>
<script>
function selectPackage(card) {
    document.querySelectorAll(".package-card").forEach(function (item) {
        item.style.transform = "";
        item.style.boxShadow = "";
        item.style.border = "";
    });

    card.style.transform = "scale(1.03)";
    card.style.boxShadow = "0 0 20px rgba(255, 215, 0, 0.95)";
    card.style.border = "2px solid #ffd700";
}
        </script>
</body>
    
</html>
